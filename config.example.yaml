# Calendar agent configuration - EXAMPLE. Copy it:  cp config.example.yaml config.yaml
# then fill in the IDs marked FILL_IN (run `venv/bin/python list_calendars.py` after `auth.py`). See SETUP.md.

# Gmail search used to find forwarded IIITH emails.
# Default assumes a Gmail filter that applies the label "iiith" to forwarded mail.
# If you don't have that label, use the fallback instead (put your IIITH address in):
#   gmail_query: 'subject:FW from:YOUR_IIITH_ADDRESS@students.iiit.ac.in'
gmail_query: 'label:iiith'

timezone: Asia/Kolkata

# Google Calendar IDs - run `python list_calendars.py` and paste the IDs here.
calendars:
  college: 'FILL_IN@group.calendar.google.com'   # deadlines, classes, meetings from email
  planner: 'FILL_IN@group.calendar.google.com'
  habits: 'FILL_IN@group.calendar.google.com'     # habits (Phase 3)

# --- Ingestion (Phase 1) ---
ollama:
  # With an NVIDIA GPU (6 GB+): gemma2:9b and require_gpu: true.
  # WITHOUT a GPU (CPU only): a smaller model and require_gpu: false, e.g.
  #   model: gemma3:4b      (ollama pull gemma3:4b; ~3.3 GB RAM, ~20-60 s per email on a laptop CPU)
  # Check it with:  venv/bin/python eval_extractor.py gemma3:4b
  model: gemma3:4b
  num_ctx: 2048          # prompt+email is ~1-1.7k tokens; 4096 pushed the model partly onto the CPU
  num_thread: 4          # CPU threads (CPU only: 4-6; fewer = cooler, slower)
  keep_alive: 30s        # unload from GPU this long after the last call in a run
  min_free_ram_gb: 3     # postpone LLM calls when less RAM than this is free (avoids OOM kills)
  timeout_s: 300
  require_gpu: false      # true only with an NVIDIA GPU; if Ollama lost the GPU (runs on CPU only), unload and stop instead of cooking the CPU
  defer_when_gpu_busy: true    # a game (or anything) using the GPU: don't load the model; emails wait, no alert
  gpu_busy_vram_mb: 1500       # "busy" = other programs use this much GPU memory...
  gpu_busy_percent: 60         # ...or the GPU is this busy
min_confidence: 0.6      # LLM items below this are dropped
first_run_days: 3        # how far back the very first run looks (use --since to backfill more)
tasklist: 'FILL_IN'   # Google Tasks list "College" (created by the agent)

# Ask on Telegram before adding anything (needs telegram_setup.py once, and approvals.py running).
approval:
  enabled: true
  learn_after_skips: 3     # after this many skips (and no adds) from one sender, offer to stop asking

# Emails whose forwarded "From:" line contains any of these are skipped entirely (no LLM, nothing created).
# The From: line includes the mailing list, e.g. "life@lists.iiit.ac.in ... On Behalf Of gaming club".
# Wildcards allowed: '*club@students.iiit.ac.in'
skip_senders:
  - life@lists.iiit.ac.in      # clubs, fests, events

# Emails whose subject contains any of these are skipped (machine notices that never hold a deadline).
skip_subjects:
  - shared with you          # Google Docs/Slides share notifications
  - flow(s) have failed      # Power Automate failure notices

# An email is sent to the LLM only if it passes this pre-filter (saves GPU time):
#  - a strong word anywhere; plurals and hyphen/space variants count ("Exams", "Mid-sem", "Quizzes"), or
#  - a weak word together with a concrete day in the same sentence ("fill the feedback form by Friday"), or
#  - "till / until / by / before <day>" ("active till 28th September")
# Emails skipped here are listed with /skipped in Telegram, with a "Read anyway" button.
keywords:
  - due
  - deadline
  - submit
  - submission
  - quiz
  - exam
  - midsem
  - mid sem
  - mid semester
  - endsem
  - end sem
  - end semester
  - evaluation
  - viva
  - meeting
  - class cancelled
  - class canceled
  - rescheduled
  - postponed
  - preponed
  - lab
  - assignment
weak_keywords:
  - feedback
  - form
  - reminder
  - registration
  - register
  - last date
  - closes
  - extended

# Optional: a URL pinged on every mail check (e.g. a free healthchecks.io check with a Telegram integration).
# If the pings stop, that service messages you that the laptop is off. Empty = disabled.
heartbeat_url: ''

# --- Your other calendars ---
# New events on these get a Track / Ignore card on Telegram (checked with every mail check).
#   ask    = card per event (one per repeating series); Track copies it into College; until you answer it
#            still blocks planning time
#   copy   = copy every event into College without asking   (the "Always track calendar" button)
#   show   = count it and show it, never copy                (your own calendar, holidays)
#   ignore = act as if the calendar didn't exist              (the "Never ask this calendar" button)
# The buttons and /calendars in Telegram override what's written here.
calendar_watch:
  enabled: true
  days_ahead: 14               # ask about events up to this far ahead
  bulk_after: 5                # more new events than this from one calendar -> one summary card
  daily_review: true           # new/changed events are collected into ONE daily review (with the morning check-in)
  urgent_hours: 24             # ...except events starting within this many hours: those are asked about right away
  default: ask                 # calendars not listed (e.g. one you subscribe to later)
  calendars:
    'primary': show                                    # your own calendar
    # 'SOME_ID@import.calendar.google.com': ask       # e.g. a timetable or Moodle feed (IDs from list_calendars.py)
    # 'en.indian#holiday@group.v.calendar.google.com': show

# --- Web page (web/app.py, http://localhost:8765) ---
# From your phone: install Tailscale, run `sudo tailscale serve --bg 8765`, then add the https name it shows here.
# Never use `tailscale funnel` (that would put the page on the public internet).
web:
  allowed_hosts: []            # e.g. ["sha-omen.tail1234.ts.net"]
  tailscale_user: ""           # your Tailscale login (e.g. you@gmail.com): only that login gets in via Tailscale

# --- Morning digest (Phase 2) ---
digest:
  days_ahead: 7
  channels: [desktop, telegram]   # see notifiers.py; add a channel there to use it here

# --- Morning check-in ---
morning:
  checkin: true                # ask for today's to-dos before planning and the morning message
  wait_minutes: 45             # go ahead without an answer after this long
  latest_checkin: "18:00"      # laptop first on after this: no "good morning" question, just plan what's left
  remind_after_minutes: 120    # a task still without a time gets one reminder (with fresh free slots) this much later
  heads_up_minutes: 5          # "Next at 15:00: ..." this long before a booked block (0 = off)
  evening_check: "21:30"       # summary of the day: done / not done / no time picked, "Move to tomorrow"
  todo_tasklist: 'FILL_IN'   # "DAILY TASKS"
  todo_default_minutes: 30     # for to-dos sent without a time

# --- Planner (Phase 3) ---
planner:
  plan_after: "06:45"          # auto-plan runs once a day, the first time the laptop is on after this
  work_window: ["08:00", "23:00"]
  sleep: ["23:30", "07:00"]    # nothing is ever planned in here (may cross midnight)
  block_minutes: 90            # work is split into blocks of at most this
  min_block_minutes: 30
  gap_minutes: 15              # breathing room around events and between blocks
  max_work_hours_per_day: 6
  default_effort_hours: 3      # per deadline, unless you pick another on its Telegram card
  effort_choices_hours: [2, 4, 8, 12, 20, 30]
  exam_prep_hours:             # preparation planned before an exam on College (change per exam with /exams)
    quiz: 2
    midsem: 8
    endsem: 12
    exam: 6                    # "exam", "test", "viva" and anything else
  task_effort_hours: 1         # your own Google Tasks that have a due date
  horizon_days: 14             # only deadlines within this many days are planned
  carry_over_days: 3           # your tasks overdue by up to this many days are planned today

# Habits: add them from Telegram with /habits (stored in state.db). Any listed here are imported once.
# Each gets free slots inside its window on its days (mon..sun; omit days = every day). Examples:
#   - name: Gym
#     minutes: 60
#     window: ["06:30", "09:00"]
#     days: [mon, wed, fri]
#   - name: Reading
#     minutes: 30
#     window: ["21:00", "23:00"]
habits: []
